<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Solar System Explorer</title>
<style>
  :root {
    --card-bg: rgba(8, 14, 32, 0.82);
    --card-border: rgba(120, 160, 255, 0.25);
    --accent: #ffd24a;
    --text: #eaf0ff;
    --text-dim: #9fb0d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; -webkit-touch-callout: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui > * { pointer-events: auto; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* ---------- top bar ---------- */
  #topbar {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  #titlebox { padding: 10px 16px; }
  #titlebox h1 { font-size: 20px; letter-spacing: 0.5px; color: var(--accent); }
  #titlebox p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  #topbuttons { display: flex; gap: 8px; }
  /* every top-row button shares one minimum width, so short ones (?, DE)
     are not slimmer than the rest */
  #topbuttons button { min-width: 44px; }
  button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: var(--text); background: rgba(30, 42, 80, 0.9);
    border: 1px solid var(--card-border); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: rgba(52, 70, 130, 0.95); }
  button:active { transform: scale(0.96); }
  button.active { background: var(--accent); color: #1a1400; border-color: var(--accent); }

  /* ---------- bottom time bar ---------- */
  #timebar {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px);
    /* width must be explicit: an auto-width abspos element at left:50% may
       only grow to the RIGHT edge (half the viewport) and would silently
       wrap onto two lines on ~700-830px screens */
    width: max-content;
  }
  .speedSliderWrap { position: relative; width: 170px; display: flex; align-items: center; }
  #speedSlider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: rgba(120, 160, 255, 0.3); outline: none; cursor: pointer;
  }
  .speedDefaultMark {
    position: absolute; top: 50%; left: 26%;   /* exact spot set by JS */
    width: 3px; height: 24px; transform: translate(-50%, -50%);
    background: var(--accent); border-radius: 2px; pointer-events: none;
  }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid rgba(26, 20, 0, 0.8); cursor: pointer;
  }
  #speedSlider::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid rgba(26, 20, 0, 0.8); cursor: pointer;
  }
  #speedLabel { min-width: 84px; text-align: center; font-size: 14px; font-weight: 600; color: var(--accent); }
  #timebar .sep { width: 1px; height: 26px; background: var(--card-border); margin: 0 4px; }
  /* play & home are identical fixed-size squares, so both ends of the
     time bar look even — emoji glyphs alone would give them different widths */
  #playBtn, #homeBtn { width: 46px; padding-left: 0; padding-right: 0; font-size: 16px; }

  /* ---------- info card ---------- */
  #infocard {
    position: absolute; left: 14px; top: 90px; width: 320px; max-height: calc(100% - 200px);
    overflow-y: auto; padding: 16px 18px; display: none;
  }
  #infocard h2 { font-size: 22px; color: var(--accent); margin-bottom: 2px; }
  #infocard .type { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
  #infocard p.fact { font-size: 14.5px; line-height: 1.5; margin-bottom: 8px; }
  #infocard .hint { font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 6px; }
  #infoClose {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
    padding: 0; border-radius: 50%; font-size: 14px; line-height: 1;
    background: rgba(30, 42, 80, 0.7); color: var(--text-dim);
  }
  #infoClose:hover { background: rgba(52, 70, 130, 0.95); color: var(--text); }

  /* ---------- places panel ---------- */
  /* flex column so the list scrolls inside the panel (JS shows it as 'flex') */
  #placesPanel {
    position: absolute; right: 14px; top: 90px; width: 195px;
    padding: 12px 14px; display: none; flex-direction: column;
  }
  #placesPanel h3 { font-size: 14px; color: var(--accent); margin-bottom: 8px; letter-spacing: 0.4px; flex: none; }
  #placesList { display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 230px); overflow-y: auto; min-height: 0; }
  .placeBtn { text-align: left; padding: 7px 10px; font-size: 14px; border-radius: 8px; background: rgba(30, 42, 80, 0.55); }
  .placeBtn:hover { background: rgba(52, 70, 130, 0.95); }
  .placeBtn.active { background: var(--accent); color: #1a1400; border-color: var(--accent); }

  /* ---------- eclipse banner ---------- */
  #eclipseBanner {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; font-size: 15px; font-weight: 600; color: var(--accent);
    display: none; text-align: center; max-width: 70vw;
  }

  /* ---------- help modal ---------- */
  #helpModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20;
    display: none; align-items: center; justify-content: center;
  }
  #helpCard { width: min(560px, 92vw); max-height: 86vh; overflow-y: auto; padding: 24px 28px; }
  #helpCard h2 { color: var(--accent); font-size: 22px; margin-bottom: 14px; }
  #helpCard table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  #helpCard td { padding: 7px 6px; border-bottom: 1px solid rgba(120,160,255,0.15); vertical-align: top; line-height: 1.45; }
  #helpCard td:first-child { white-space: nowrap; width: 1%; padding-right: 14px; font-weight: 700; color: var(--accent); }
  kbd {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 13px;
  }
  #helpClose { margin-top: 18px; width: 100%; }
  #creditsSection { margin-top: 18px; border-top: 1px solid var(--card-border); padding-top: 14px; }
  #creditsTitle { font-size: 15px; color: var(--accent); margin-bottom: 8px; letter-spacing: 0.4px; }
  #creditsList p { font-size: 13px; line-height: 1.5; color: var(--text-dim); margin-bottom: 6px; }
  #creditsList b { color: var(--text); }
  #creditsList a { color: #7fb2ff; text-decoration: none; }
  #creditsList a:hover { text-decoration: underline; }

  /* ---------- loading / error ---------- */
  #loading {
    position: fixed; inset: 0; background: #04060f; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #loading .sun {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3b0, #ffb347 60%, #ff7b00);
    box-shadow: 0 0 60px 18px rgba(255, 160, 40, 0.55);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #loading p { font-size: 17px; color: var(--text-dim); }
  #fatal {
    position: fixed; inset: 0; background: #04060f; z-index: 40; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 30px; font-size: 16px; line-height: 1.5;
  }

  /* ---------- small screens (phones, portrait AND landscape) ----------
     Landscape phones are wider than 700px but short — match them by height
     too, so they get the same compact single-line bar as portrait. */
  @media (max-width: 700px), (max-height: 480px) {
    #topbar { flex-direction: column; align-items: stretch; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; gap: 6px; }
    #titlebox { padding: 7px 12px; }
    #titlebox h1 { font-size: 15px; }
    #titlebox p { display: none; }
    /* uniform button width (43px ≥ widest emoji label) + tight gap, so all
       eight buttons stay the same size AND fit one row on a 390px phone */
    #topbuttons { flex-wrap: wrap; justify-content: center; gap: 4px; }
    #topbuttons button { min-width: 43px; }
    button { font-size: 13px; padding: 9px 10px; min-height: 42px; }
    /* emoji-only labels on phones (text set via data-short in applyLang) */
    #topbuttons button[data-short] { font-size: 0; }
    #topbuttons button[data-short]::after { content: attr(data-short); font-size: 15px; }
    #eclipseBanner { top: 100px; max-width: 92vw; font-size: 13.5px; padding: 8px 14px; }
    #infocard, #placesPanel {
      left: 8px; right: 8px; width: auto; top: auto;
      bottom: calc(72px + env(safe-area-inset-bottom));
    }
    #infocard { max-height: 32vh; padding: 12px 14px; }
    /* Places = full-height bottom sheet from just below the top button row
       down to the time bar; the list scrolls inside it when entries overflow,
       so every place is always reachable on any phone size. */
    #placesPanel { top: calc(102px + env(safe-area-inset-top)); max-height: none; }
    #placesList { max-height: none; }
    #timebar {
      left: 8px; right: 8px; transform: none;
      /* width is max-content (base rule), so auto margins centre the bar */
      margin: 0 auto;
      bottom: max(8px, env(safe-area-inset-bottom));
      gap: 6px; padding: 7px 10px;
    }
    .speedSliderWrap { width: 105px; }
    #speedSlider { height: 26px; background: transparent; }
    #speedSlider::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(120, 160, 255, 0.3); }
    #speedSlider::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -8px; }
    #speedSlider::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(120, 160, 255, 0.3); }
    #speedSlider::-moz-range-thumb { width: 20px; height: 20px; }
    #speedLabel { min-width: 56px; font-size: 12px; }
    #helpCard { padding: 18px 16px; }
    #helpCard table { font-size: 13px; }
  }
</style>
</head>

  <div class="sun"></div>

</div>

<div id="fatal">

  <p id="fatalMsg"></p>
</div>

    </div>

      <button id="texBtn">📷 Photos</button>

      <button id="scaleBtn" title="Toggle true-to-scale planet sizes">🔬 Real size</button>
      <button id="compareBtn" title="Line up all planets side by side at true relative size">📏 Compare</button>
      <button id="eclipseBtn" title="Start a solar eclipse over Earth">🌑 Eclipse</button>
      <button id="placesBtn">🗺 Places</button>
    </div>
  </div>

  <div id="eclipseBanner" class="card"></div>

  <div id="infocard" class="card">
    <button id="infoClose" title="Close">✕</button>
    <h2 id="infoName"></h2>
    <div class="type" id="infoType"></div>
    <div id="infoFacts"></div>
    <div class="hint" id="infoHint"></div>
  </div>

  <div id="placesPanel" class="card">
    <h3 id="placesTitle">Where to fly?</h3>
    <div id="placesList"></div>
  </div>

  <div id="timebar" class="card">
    <button id="playBtn" title="Pause / Play">⏸</button>
    <span class="sep"></span>
    <div class="speedSliderWrap">
      <input type="range" id="speedSlider" min="-3" max="2" step="0.001" value="-1.69897" title="Simulation speed (days per second)">
      <span class="speedDefaultMark"></span>
    </div>
    <span id="speedLabel">0.02 d/s</span>
    <span class="sep"></span>
    <button id="homeBtn" title="Back to start view">🏠</button>
  </div>
</div>

<div id="helpModal">
  <div id="helpCard" class="card">
    <h2 id="helpTitle">How to play</h2>
    <table id="helpTable"></table>
    <div id="creditsSection">
      <h3 id="creditsTitle">Credits</h3>
      <div id="creditsList"></div>
    </div>
    <button id="helpClose">OK</button>
  </div>
</div>

<script type="module">
// =====================================================================
//  Solar System Explorer — a 3D learning game for kids
//  Single-file app. Three.js is loaded from a CDN (needs internet once).
// =====================================================================

const $ = id => document.getElementById(id);

function showFatal(title, msg) {
  $('loading').style.display = 'none';
  $('fatalTitle').textContent = title;
  $('fatalMsg').textContent = msg;
  $('fatal').style.display = 'flex';
}

// --- Load Three.js with Subresource Integrity (SRI) ----------------------
// The engine comes from a CDN, so we verify its SHA-384 hash BEFORE running
// any of it: if the downloaded file doesn't match the known-good value for
// three@0.160.0 (e.g. compromised CDN or altered content), nothing executes
// and a warning is shown instead.
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const THREE_SRI = 'sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ';

async function loadThree() {
  const res = await fetch(THREE_URL, { mode: 'cors' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = await res.arrayBuffer();
  // Verify integrity first — the fetched code is not executed yet.
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-384', buf));
  const b64 = btoa(String.fromCharCode.apply(null, digest));
  if (THREE_SRI !== 'sha384-' + b64) throw new Error('integrity mismatch');
  // Execute the verified bytes in a fresh module scope.
  const url = URL.createObjectURL(new Blob([buf], { type: 'text/javascript' }));
  try {
    return await import(url);
  } finally {
    URL.revokeObjectURL(url);
  }
}

let THREE;
try {
  THREE = await loadThree();
} catch (e) {
  const tampered = /integrity/i.test(String((e && e.message) || ''));
  // crypto.subtle only exists in secure contexts (https, localhost, file://).
  // Over plain http://<ip> the checksum step itself fails — say so explicitly
  // instead of blaming the connection.
  const noCrypto = !(window.crypto && window.crypto.subtle);
  showFatal('Could not load 3D engine',
    noCrypto
      ? 'This browser hides the security features needed to verify the 3D engine over an insecure connection. Please open this page via https://, localhost, or as a local file and reload.'
      : tampered
        ? 'The Three.js file downloaded from the CDN did not match its expected checksum, so it was NOT executed. Please reload the page — if this keeps happening, do not use this app.'
        : 'This app loads Three.js from the internet. Please check your connection and reload the page.');
  throw e;
}

// =====================================================================
//  Small seeded value-noise (3D) for seamless procedural textures
// =====================================================================
function makeNoise(seed) {
  let s = seed >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const perm = new Uint8Array(512);
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * (3 - 2 * t);
  function n3(x, y, z) {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    x -= X; y -= Y; z -= Z;
    const u = fade(x), v = fade(y), w = fade(z);
    const xi = X & 255, yi = Y & 255, zi = Z & 255;
    const h = (i, j, k) => perm[(perm[(perm[i & 255] + j) & 255] + k) & 255] / 255;
    const lerp = (a, b, f) => a + (b - a) * f;
    return lerp(
      lerp(lerp(h(xi, yi, zi),     h(xi+1, yi, zi),     u),
           lerp(h(xi, yi+1, zi),   h(xi+1, yi+1, zi),   u), v),
      lerp(lerp(h(xi, yi, zi+1),   h(xi+1, yi, zi+1),   u),
           lerp(h(xi, yi+1, zi+1), h(xi+1, yi+1, zi+1), u), v), w);
  }
  function fbm(x, y, z, oct) {
    let a = 0, amp = 0.5, f = 1, tot = 0;
    for (let i = 0; i < oct; i++) { a += amp * n3(x * f, y * f, z * f); tot += amp; amp *= 0.5; f *= 2; }
    return a / tot;
  }
  return { n3, fbm };
}

// Sample noise on a cylinder so equirectangular textures have no seam at u=0/1
function cylPoint(u, v, scale) {
  const th = u * Math.PI * 2;
  return [Math.cos(th) * scale, (v - 0.5) * scale * 2, Math.sin(th) * scale];
}

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerpC = (c1, c2, f) => [
  c1[0] + (c2[0] - c1[0]) * f, c1[1] + (c2[1] - c1[1]) * f, c1[2] + (c2[2] - c1[2]) * f];

function makeTexture(w, h, pixelFn) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      const [r, g, b, a] = pixelFn(u, v);
      const i = (y * w + x) * 4;
      d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = a === undefined ? 255 : a;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// =====================================================================
//  Procedural planet textures
// =====================================================================
function texEarth() {
  const N = makeNoise(42);
  const cv = makeTexture(2048, 1024, (u, v) => {
    const [nx, ny, nz] = cylPoint(u, v, 1.7);
    const e = N.fbm(nx + 3.1, ny + 7.7, nz + 1.9, 6);          // elevation
    const detail = N.fbm(nx * 3 + 9, ny * 3, nz * 3 + 4, 5);   // fine detail
    const lat = Math.abs(v - 0.5) * 2;                          // 0 equator .. 1 pole
    const iceEdge = 0.82 + (N.n3(nx * 2, ny * 2, nz * 2) - 0.5) * 0.14;
    if (lat > iceEdge) return [235, 242, 250];                 // polar ice
    if (e < 0.5) {                                              // ocean
      const depth = clamp((0.5 - e) * 6, 0, 1);
      return lerpC([38, 96, 168], [8, 32, 74], depth);
    }
    if (e > 0.66) {                                             // mountains
      const m = clamp((e - 0.66) * 8, 0, 1);
      return lerpC([122, 106, 84], [196, 190, 178], m);
    }
    // land: green -> tan by latitude & detail
    const veg = clamp(0.75 - lat * 0.9 + (detail - 0.5) * 0.7, 0, 1);
    return lerpC([168, 148, 92], [52, 112, 52], veg);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function texClouds() {
  const N = makeNoise(77);
  const cv = makeTexture(2048, 1024, (u, v) => {
    const [nx, ny, nz] = cylPoint(u, v, 2.2);
    const c = N.fbm(nx + 31, ny + 12, nz + 5, 5);
    const a = clamp((c - 0.52) * 4.2, 0, 1) * 235;
    return [255, 255, 255, a];
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function texCratered(baseA, baseB, seed, craters) {
  const N = makeNoise(seed);
  const cv = makeTexture(1024, 512, (u, v) => {
    const [nx, ny, nz] = cylPoint(u, v, 2.0);
    const n = N.fbm(nx + 5, ny + 2, nz + 8, 5);
    return lerpC(baseA, baseB, n);
  });
  const ctx = cv.getContext('2d');
  let s = seed;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < craters; i++) {
    const x = rnd() * 1024, y = 60 + rnd() * 392, r = 2 + rnd() * rnd() * 16;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 0.9, Math.PI * 1.7);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = Math.max(1, r * 0.25); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function texBanded(palette, seed, bandFreq, wobble, spot) {
  const N = makeNoise(seed);
  const cv = makeTexture(1024, 512, (u, v) => {
    const [nx, ny, nz] = cylPoint(u, v, 1.8);
    const w = N.fbm(nx * 1.4 + 3, ny * 1.4, nz * 1.4 + 6, 4) - 0.5;
    let yv = v + w * wobble;
    const t = (Math.sin(yv * Math.PI * bandFreq) * 0.5 + 0.5);
    const idx = t * (palette.length - 1);
    const i0 = Math.floor(idx), f = idx - i0;
    let col = lerpC(palette[i0], palette[Math.min(i0 + 1, palette.length - 1)], f);
    if (spot) {
      // Great-Red-Spot style oval storm
      const du = Math.min(Math.abs(u - spot.u), 1 - Math.abs(u - spot.u));
      const dv = v - spot.v;
      const d = (du / spot.rx) ** 2 + (dv / spot.ry) ** 2;
      if (d < 1) col = lerpC(spot.color, col, clamp(d * 1.4, 0, 1));
    }
    return col;
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function texMars() {
  const N = makeNoise(99);
  const cv = makeTexture(1024, 512, (u, v) => {
    const [nx, ny, nz] = cylPoint(u, v, 1.9);
    const n = N.fbm(nx + 2, ny + 6, nz + 1, 5);
    let col = lerpC([150, 74, 42], [206, 128, 84], n);
    const dark = N.fbm(nx * 2 + 11, ny * 2, nz * 2 + 3, 4);
    if (dark > 0.58) col = lerpC(col, [96, 52, 34], clamp((dark - 0.58) * 5, 0, 0.7));
    const lat = Math.abs(v - 0.5) * 2;
    if (lat > 0.9 + (n - 0.5) * 0.06) col = [232, 228, 224]; // polar caps
    return col;
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function texSun() {
  const N = makeNoise(5);
  const cv = makeTexture(1024, 512, (u, v) => {
    const [nx, ny, nz] = cylPoint(u, v, 3.0);
    const g = N.fbm(nx * 2 + 1, ny * 2, nz * 2 + 9, 4);
    return lerpC([255, 122, 8], [255, 244, 190], clamp(g * 1.3, 0, 1));
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function texSaturnRings() {
  const N = makeNoise(21);
  const w = 1024, h = 8;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let x = 0; x < w; x++) {
    const t = x / w;
    let a = clamp(N.n3(t * 40, 0.5, 0.5) * 0.7 + N.n3(t * 90, 3.1, 7.7) * 0.5, 0, 1);
    a = clamp(a * 1.6 - 0.25, 0, 1) * 235;
    if (t < 0.08) a *= t / 0.08;                 // inner fade
    if (t > 0.94) a *= (1 - t) / 0.06;           // outer fade
    if (Math.abs(t - 0.62) < 0.035) a *= 0.12;   // Cassini division
    const c = lerpC([196, 178, 140], [232, 220, 190], N.n3(t * 25, 9, 2));
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      img.data[i] = c[0]; img.data[i+1] = c[1]; img.data[i+2] = c[2]; img.data[i+3] = a;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.0, 'rgba(255,240,200,1)');
  g.addColorStop(0.25, 'rgba(255,190,80,0.55)');
  g.addColorStop(0.6, 'rgba(255,140,30,0.14)');
  g.addColorStop(1.0, 'rgba(255,120,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(cv);
}

const PHOTO_URLS = {
  sun:     SW_TEX + 'sun.jpg',
  mercury: SW_TEX + 'mercury.jpg',
  venus:   SW_TEX + 'venus_surface.jpg',
  earth:   SW_TEX + 'earth_day.jpg',
  mars:    SW_TEX + 'mars.jpg',
  jupiter: SW_TEX + 'jupiter.jpg',
  saturn:  SW_TEX + 'saturn.jpg',
  uranus:  SW_TEX + 'uranus.jpg',
  neptune: SW_TEX + 'neptune.jpg',
  moon:    SW_TEX + 'moon.jpg',
  // Real NASA cloud photo (white on black) — used as the cloud layer's alpha map.
  earthClouds: SW_TEX + 'earth_clouds.jpg',
};
const photoLoader = new THREE.TextureLoader();
photoLoader.setCrossOrigin('anonymous');

let texMode = localStorage.getItem('ssx_texmode');
if (texMode !== 'procedural' && texMode !== 'photo') texMode = 'procedural';  // guard: unknown/tampered value → default
const photoTex = {};   // key -> loaded THREE.Texture (only for bodies that loaded OK)

function loadPhoto(key) {
  return new Promise(resolve => {
    photoLoader.load(
      PHOTO_URLS[key],
      tex => {
        // Downscale huge photos (some are 8192×4096 ≈ 134 MB each in GPU memory).
        // 4096 wide is indistinguishable at the sizes we view planets.
        const img = tex.image;
        if (img.naturalWidth > 4096) {
          const cv = document.createElement('canvas');
          cv.width = 4096;
          cv.height = Math.round(4096 * img.naturalHeight / img.naturalWidth);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          tex.image = cv;
        }
        // The cloud photo is an alpha mask, not a color map — keep it in linear
        // space so the coverage matches what you see in the image.
        if (key !== 'earthClouds') tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = maxAniso;
        tex.needsUpdate = true;
        photoTex[key] = tex;
        resolve(true);
      },
      undefined,
      () => resolve(false)   // error → keep procedural for this body
    );
  });
}

// Swap one body's surface map between photo and procedural.
function setBodyMap(key, usePhoto) {
  const mesh = key === 'sun' ? sunMesh : key === 'moon' ? moonMesh : bodies[key].mesh;
  const mat = mesh.material;
  if (usePhoto && photoTex[key]) mat.map = photoTex[key];
  else mat.map = procMaps[key];
  mat.needsUpdate = true;
}

// --- "Real size" mode -------------------------------------------------
// True equatorial radii in km (NASA fact sheet). In real-size mode every
// body is scaled so its radius is proportional to reality relative to the
// Sun (the Sun itself stays at SUN_R — it is our reference). Orbits keep
// their compressed distances; only the bodies shrink.
const REAL_KM = {
  sun: 696340, mercury: 2439.7, venus: 6051.8, earth: 6371, moon: 1737.4,
  mars: 3389.5, jupiter: 69911, saturn: 58232, uranus: 25362, neptune: 24622,
};
const realSceneR = key => SUN_R * REAL_KM[key] / REAL_KM.sun;

// and meanLon (L, mean longitude) are the real NASA "Planetary Fact Sheet"

// slightly tilted plane, and at t=0 the planets sit where they really were

// =====================================================================
//  Elliptical orbits (Kepler)
// =====================================================================
const TWO_PI = Math.PI * 2;
const D2R = Math.PI / 180;

// Precompute each planet's orbital orientation once: argument of perihelion
// ω = ϖ − Ω, mean anomaly at t=0 M₀ = L − ϖ, and the rotation coefficients
// that take a point (xp, yp) in the orbital plane to scene coordinates
// (ecliptic X→x, Y→z, Z→y, so +Y is "north" of the ecliptic).
for (const p of PLANETS) {
  const w = D2R * (p.periLon - p.node);
  const i = D2R * p.inc;
  const O = D2R * p.node;
  const cw = Math.cos(w), sw = Math.sin(w);
  const ci = Math.cos(i), si = Math.sin(i);
  const cO = Math.cos(O), sO = Math.sin(O);
  p.M0 = D2R * (p.meanLon - p.periLon);
  // Perifocal → ecliptic rotation, precomputed from the standard position
  // formula x = r[cosΩ·cos(ω+ν) − sinΩ·sin(ω+ν)·cos i] etc. (perihelion ends
  // up at ecliptic longitude Ω+ω, as it should):
  p.orb = {
    a: p.dist, e: p.e, b: p.dist * Math.sqrt(1 - p.e * p.e),
    m11: cO * cw - sO * sw * ci,   m12: -cO * sw - sO * cw * ci,
    m21: sO * cw + cO * sw * ci,   m22: -sO * sw + cO * cw * ci,
    m31: sw * si,                  m32: cw * si,
  };
}

// Point on the orbit for a given eccentric anomaly E (used for the orbit line)
function orbitPoint(p, E, out) {
  const o = p.orb;
  const xp = o.a * (Math.cos(E) - o.e);
  const yp = o.b * Math.sin(E);
  return out.set(o.m11 * xp + o.m12 * yp, o.m31 * xp + o.m32 * yp, o.m21 * xp + o.m22 * yp);
}

// Planet position at a given time: solve Kepler's equation M = E − e·sin E
// (Newton iteration — 6 steps is plenty for e ≤ 0.21) and map to scene space.
function planetPos(p, days, out) {
  const o = p.orb;
  const M = p.M0 + (days / p.period) * TWO_PI;
  let E = M + o.e * Math.sin(M);
  for (let k = 0; k < 6; k++) {
    E -= (E - o.e * Math.sin(E) - M) / (1 - o.e * Math.cos(E));
  }
  return orbitPoint(p, E, out);
}

function makeStars(count, rMin, rMax, size) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(rMin + Math.random() * (rMax - rMin));
    pos.set([v.x, v.y, v.z], i * 3);
    const warm = Math.random();
    const c = warm > 0.85 ? [1, 0.8, 0.6] : warm > 0.7 ? [0.75, 0.85, 1] : [1, 1, 1];
    const b = 0.4 + Math.random() * 0.6;
    col.set([c[0] * b, c[1] * b, c[2] * b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    size, vertexColors: true, sizeAttenuation: false, transparent: true, opacity: 0.9, depthWrite: false }));
}

let milkySky = null;
function raDecToScene(raDeg, decDeg) {
  // equatorial (RA/Dec) → ecliptic (obliquity ε = 23.439°), then the same
  // mapping the orbits use: ecliptic X→x, Y→z, Z→y (+y = north of ecliptic).
  const ra = raDeg * D2R, dec = decDeg * D2R, eps = 23.4393 * D2R;
  const xe = Math.cos(dec) * Math.cos(ra);
  const ye = Math.cos(dec) * Math.sin(ra);
  const ze = Math.sin(dec);
  return new THREE.Vector3(
    xe,
    -ye * Math.sin(eps) + ze * Math.cos(eps),   // ecliptic Z → scene y
    ye * Math.cos(eps) + ze * Math.sin(eps));   // ecliptic Y → scene z
}
photoLoader.load(SW_TEX + 'milkyway.jpg', tex => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  // A BackSide sphere shows its texture mirrored from inside; flipping u makes
  // the sampling match three.js' equirect-background convention → correct sky.
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.x = -1;
  tex.offset.x = 1;
  const sky = new THREE.Mesh(
    // big sphere around the camera (inside camera.far, behind every body);
    // slightly dimmed so the planets and orbit lines stay the main attraction
    new THREE.SphereGeometry(2900, 64, 32),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite: false, color: 0x8a8a92 }));
  // orient like the real sky: galactic centre at the texture's horizontal
  // middle (local +X on a three.js sphere), north galactic pole at the top
  // (local +Y). Right-handed basis → proper rotation.
  const gc = raDecToScene(266.405, -28.936);     // direction of Sagittarius A*
  const ngp = raDecToScene(192.8595, 27.1284);   // galactic north pole
  const yUp = ngp.sub(gc.clone().multiplyScalar(ngp.dot(gc))).normalize();
  const zCol = new THREE.Vector3().crossVectors(gc, yUp);
  sky.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(gc, yUp, zCol));
  // keep the sky centred on the camera (skybox style): zero parallax and it
  // can never be clipped by the far plane, no matter how far the user flies.
  milkySky = sky;
  scene.add(sky);
}, undefined, () => {});   // load error → keep the plain procedural starfield

function makeOrbitLine(radius, color, parent) {
  const pts = [];
  for (let i = 0; i <= 256; i++) {
    const a = (i / 256) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.28 })
  );
  (parent || scene).add(line);
  return line;
}

// Elliptical orbit path for a planet (the Sun sits at the focus = origin)
function makeOrbitPath(p, color, parent) {
  const pts = [];
  const v = new THREE.Vector3();
  for (let i = 0; i <= 360; i++) {
    pts.push(orbitPoint(p, (i / 360) * TWO_PI, v).clone());
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.28 })
  );
  (parent || scene).add(line);
  return line;
}

function buildPlanet(p) {

  tiltG.rotation.z = THREE.MathUtils.degToRad(p.tilt);
  group.add(tiltG);

  let map;
  switch (p.key) {
    case 'mercury': map = texCratered([120, 112, 104], [176, 168, 158], 11, 320); break;
    case 'venus':   map = texBanded([[216,181,106],[232,207,154],[201,162,79],[226,199,138]], 23, 9, 0.05); break;
    case 'earth':   map = texEarth(); break;
    case 'mars':    map = texMars(); break;
    case 'jupiter': map = texBanded([[216,202,157],[181,122,78],[227,211,179],[160,90,60],[214,196,150]], 31, 13, 0.035,
                    { u: 0.3, v: 0.63, rx: 0.055, ry: 0.032, color: [181, 67, 46] }); break;
    case 'saturn':  map = texBanded([[224,205,160],[212,189,138],[201,177,124],[228,214,178]], 41, 11, 0.03); break;
    case 'uranus':  map = texBanded([[159,214,217],[146,204,210],[168,220,222]], 51, 5, 0.02); break;
    case 'neptune': map = texBanded([[63,102,212],[52,88,190],[74,116,224],[58,96,200]], 61, 7, 0.03); break;
  }
  map.anisotropy = maxAniso;
  procMaps[p.key] = map;   // keep the procedural version for switching back

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 64, 32),
    new THREE.MeshStandardMaterial({ map, roughness: 0.95, metalness: 0 })
  );
  mesh.userData.bodyKey = p.key;
  tiltG.add(mesh);

  // Earth extras: clouds + atmosphere
  if (p.key === 'earth') {
    const cloudMap = texClouds();
    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(p.r * 1.025, 64, 32),
      new THREE.MeshStandardMaterial({ map: cloudMap, transparent: true, depthWrite: false, alphaTest: 0.08, roughness: 1 })
    );
    clouds.userData.procMap = cloudMap;   // kept so photo mode can swap in real clouds and back
    tiltG.add(clouds);
    p.clouds = clouds;
    const atmo = new THREE.Mesh(
      new THREE.SphereGeometry(p.r * 1.09, 48, 24),
      new THREE.MeshBasicMaterial({ color: 0x4a90d9, transparent: true, opacity: 0.13, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    group.add(atmo);
    p.atmo = atmo;   // kept so real-size mode can scale it with the globe
  }

  // Saturn rings
  if (p.key === 'saturn') {
    const inner = p.r * 1.25, outer = p.r * 2.15;
    const rg = new THREE.RingGeometry(inner, outer, 160, 1);
    const pos = rg.attributes.position, uv = rg.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      uv.setXY(i, (Math.sqrt(x * x + y * y) - inner) / (outer - inner), 0.5);
    }
    // Lit material so the rings show day/night shading AND cast/receive shadows.
    // alphaTest makes the shadow respect the ring's transparency (gaps + Cassini division).
    const rings = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({
      map: texSaturnRings(), side: THREE.DoubleSide, transparent: true,
      depthWrite: false, roughness: 1, metalness: 0, alphaTest: 0.05 }));
    rings.rotation.x = Math.PI / 2;
    tiltG.add(rings);
    saturnRings = rings;
    SATURN_RING.inner = inner;
    SATURN_RING.outer = outer;
  }

  scene.add(group);
  p.orbitLine = makeOrbitPath(p, 0x4a6aa8, scene);

  bodies[p.key] = { key: p.key, group, tiltG, mesh, clouds: p.clouds || null, radius: p.r, dist: p.dist, period: p.period, rotDays: p.rotDays };
  pickables.push(mesh);
}
PLANETS.forEach(buildPlanet);

const MOON_INC = THREE.MathUtils.degToRad(5.14);

// =====================================================================
//  Analytic shadows (Moon on Earth, Saturn's rings on the planet & back)
// =====================================================================
// Instead of a shadow map, each affected surface ray-marches toward the Sun
// and tests it against the Moon (sphere) and/or the ring plane (annulus).
// Resolution-independent: the Cassini gap casts a razor-sharp line, and the
// eclipse umbra/penumbra come out with physically correct soft edges.
// The Sun's angular radius as seen from a body at distance d (drives penumbra width)
const sunAngularR = d => Math.asin(SUN_R / d);

function analyticShadowGLSL({ moon, ring }) {
  const parts = [];
  if (moon) parts.push(`
uniform vec3 uOccPos;       // occluder sphere centre, world space
uniform float uOccR;        // occluder sphere radius`);
  if (ring) parts.push(`
uniform vec3 uRingCenter;   // ring-plane centre, world space
uniform vec3 uRingNormal;   // ring-plane normal, world space
uniform vec2 uRingRadii;    // (inner, outer)
uniform sampler2D uRingTex; // radial alpha profile of the rings`);
  parts.push(`
uniform float uSunAng;      // Sun's angular radius as seen from this body

// Soft occlusion by a sphere. The Sun (angular radius uSunAng) and the
// occluder (angular radius beta) are two discs on the sky as seen from the
// surface point; their overlap gives umbra / penumbra / full light.
float softSphere( vec3 ro, vec3 rd, vec3 c, float r ) {
  vec3 v = c - ro;
  float d = length( v );
  float beta  = asin( clamp( r / d, 0.0, 1.0 ) );            // occluder disc radius
  float alpha = acos( clamp( dot( rd, v / d ), -1.0, 1.0 ) ); // centre offset from Sun dir
  if ( alpha >= beta + uSunAng ) return 1.0;                 // discs don't overlap
  if ( alpha <= beta - uSunAng ) return 0.0;                 // Sun fully covered: umbra
  if ( alpha <= uSunAng - beta ) {                           // occluder inside Sun disc
    float k = beta / uSunAng;
    return 1.0 - k * k;                                      // ~area ratio
  }
  float x = ( alpha - abs( beta - uSunAng ) ) / ( 2.0 * min( beta, uSunAng ) );
  return clamp( x, 0.0, 1.0 );                               // penumbra ramp
}
`);
  if (ring) parts.push(`
// Occlusion by the (zero-thickness) ring plane: the ray toward the Sun
// crosses the annulus -> blocked by the local ring opacity. The Cassini
// division (alpha ~0) lets a crisp band of light through.
float softRing( vec3 ro, vec3 rd ) {
  float d = dot( uRingNormal, rd );
  if ( abs( d ) < 1e-5 ) return 1.0;
  float t = dot( uRingCenter - ro, uRingNormal ) / d;
  if ( t <= 0.0 ) return 1.0;                 // plane behind us
  vec3 p = ro + rd * t;
  float r = length( p - uRingCenter );
  if ( r < uRingRadii.x || r > uRingRadii.y ) return 1.0;
  float a = texture2D( uRingTex, vec2( ( r - uRingRadii.x ) / ( uRingRadii.y - uRingRadii.x ), 0.5 ) ).a;
  return 1.0 - a;                             // gaps let light through
}
`);
  parts.push(`
// Total light factor at the surface point: product of all occluders.
float analyticShadowFactor( vec3 worldPos, vec3 worldNormal ) {
  vec3 rd = normalize( -worldPos );            // toward the Sun (at the origin)
  vec3 ro = worldPos + worldNormal * 0.02;     // lift off the surface: no self-shadow
  float f = 1.0;
${moon ? '  f *= softSphere( ro, rd, uOccPos, uOccR );\n' : ''}${ring ? '  f *= softRing( ro, rd );\n' : ''}  return f;
}
`);
  return parts.join('');
}

function applyAnalyticShadow(mat, opts) {
  const uniforms = {
    uOccPos: { value: new THREE.Vector3() },
    uOccR: { value: opts.occR || 0 },
    uRingCenter: { value: new THREE.Vector3() },
    uRingNormal: { value: new THREE.Vector3(0, 1, 0) },
    uRingRadii: { value: new THREE.Vector2(SATURN_RING.inner, SATURN_RING.outer) },
    uRingTex: { value: opts.ring ? saturnRings.material.map : null },   // same texture the rings render with
    uSunAng: { value: opts.angR },
    uShadowOn: { value: 1 },   // 0 in Compare mode (the Sun is not at the origin there)
  };
  mat.userData.analyticUniforms = uniforms;   // kept for the per-frame updates
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    // world-space position AND normal (the built-in worldPosition varying is
    // only emitted when envmap/shadowmap features are on — we need them
    // unconditionally). The fragment's `geometryNormal` is VIEW space, so it
    // must not be mixed with world-space positions — hence vAsWorldNormal.
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vAsWorldPos;\nvarying vec3 vAsWorldNormal;')
      // objectNormal is in scope from beginnormal_vertex (before defaultnormal_vertex);
      // transformed only exists after begin_vertex, so the position is set later.
      .replace('#include <defaultnormal_vertex>', '#include <defaultnormal_vertex>\n\tvAsWorldNormal = normalize( mat3( modelMatrix ) * objectNormal );')
      .replace('#include <project_vertex>', '#include <project_vertex>\n\tvAsWorldPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vAsWorldPos;\nvarying vec3 vAsWorldNormal;\nuniform float uShadowOn;\n' + analyticShadowGLSL(opts))
      // onBeforeCompile runs BEFORE the #include chunks are expanded, so we must
      // anchor on a literal include token. Right after lights_fragment_begin all
      // direct (sun) light is accumulated in reflectedLight — multiply it there;
      // ambient stays, so the night side is unchanged.
      .replace('#include <lights_fragment_begin>',
               '#include <lights_fragment_begin>\n\tif ( uShadowOn > 0.5 ) { float asf = analyticShadowFactor( vAsWorldPos, vAsWorldNormal ); reflectedLight.directDiffuse *= asf; reflectedLight.directSpecular *= asf; }');
  };
  mat.customProgramCacheKey = () => (opts.moon ? 'am' : '') + (opts.ring ? 'ar' : '');
}

// Earth: receives the Moon's shadow (solar eclipses!) — globe AND clouds
applyAnalyticShadow(bodies.earth.mesh.material, { moon: true, occR: MOON_R, angR: sunAngularR(55) });
if (bodies.earth.clouds) applyAnalyticShadow(bodies.earth.clouds.material, { moon: true, occR: MOON_R, angR: sunAngularR(55) });
// Moon: receives Earth's shadow (lunar eclipses) — same sphere test, swapped roles
applyAnalyticShadow(moonMesh.material, { moon: true, occR: bodies.earth.radius, angR: sunAngularR(55) });
// Saturn: receives the rings' shadow on its globe
if (bodies.saturn) applyAnalyticShadow(bodies.saturn.mesh.material, { ring: true, angR: sunAngularR(140) });
// The rings themselves: receive Saturn's shadow (the planet blocks the Sun)
if (saturnRings) applyAnalyticShadow(saturnRings.material, { moon: true, occR: bodies.saturn.radius, angR: sunAngularR(140) });

// Per-frame uniform updates (called from animate())
const _asQuat = new THREE.Quaternion();
const ringCenterV = new THREE.Vector3();
const ringNormalV = new THREE.Vector3(0, 1, 0);
function updateAnalyticShadows() {
  const earthP = bodies.earth.group.position;
  // Earth sees the Moon's shadow (solar eclipses); the Moon sees Earth's (lunar eclipses)
  for (const m of [bodies.earth.mesh.material, bodies.earth.clouds && bodies.earth.clouds.material]) {
    if (m) m.userData.analyticUniforms.uOccPos.value.copy(moonPos);
  }
  moonMesh.material.userData.analyticUniforms.uOccPos.value.copy(earthP);
  if (saturnRings) {
    const s = bodies.saturn;
    // the rings see Saturn's shadow
    saturnRings.material.userData.analyticUniforms.uOccPos.value.copy(s.group.position);
    s.tiltG.getWorldPosition(ringCenterV);
    ringNormalV.set(0, 1, 0).applyQuaternion(s.tiltG.getWorldQuaternion(_asQuat));
    for (const m of [s.mesh.material, saturnRings.material]) {
      const u = m.userData.analyticUniforms;
      u.uRingCenter.value.copy(ringCenterV);
      u.uRingNormal.value.copy(ringNormalV);
    }
  }
}

// Enable / disable the analytic (Moon & ring) shadows. They assume the Sun sits
// at the origin, so they are switched OFF in Compare mode — there the PointLight
// already gives a correct day/night terminator from the Sun's real position.
function setAnalyticShadows(on) {
  const mats = [bodies.earth.mesh.material, bodies.earth.clouds && bodies.earth.clouds.material,
    moonMesh.material, bodies.saturn.mesh.material, saturnRings && saturnRings.material];
  for (const m of mats) if (m && m.userData.analyticUniforms) m.userData.analyticUniforms.uShadowOn.value = on ? 1 : 0;
}

// =====================================================================
//  Real-size mode: shrink every body to its true radius (relative to Sun)
// =====================================================================
// Scales the visual meshes (globe, clouds, atmosphere, rings, Moon) by the
// ratio realRadius/displayRadius, and keeps the analytic-shadow uniforms in
// sync so ring/eclipse shadows still line up with the smaller bodies.
function applyRealScale(on) {
  for (const p of PLANETS) {
    const b = bodies[p.key];
    const f = on ? realSceneR(p.key) / p.r : 1;
    b.mesh.scale.setScalar(f);
    if (b.clouds) b.clouds.scale.setScalar(f);
    if (p.atmo) p.atmo.scale.setScalar(f);
    if (p.key === 'saturn' && saturnRings) {
      saturnRings.scale.setScalar(f);
      SATURN_RING.inner = p.r * 1.25 * f;
      SATURN_RING.outer = p.r * 2.15 * f;
      for (const m of [b.mesh.material, saturnRings.material]) {
        m.userData.analyticUniforms.uRingRadii.value.set(SATURN_RING.inner, SATURN_RING.outer);
      }
    }
  }
  moonMesh.scale.setScalar(on ? realSceneR('moon') / MOON_R : 1);

  // Occluder radii used by the analytic shadows (Moon on Earth, Earth on Moon,
  // Saturn on its rings) must match the scaled sizes.
  const moonOccR   = on ? realSceneR('moon')   : MOON_R;
  const earthOccR  = on ? realSceneR('earth')  : bodies.earth.radius;
  const saturnOccR = on ? realSceneR('saturn') : bodies.saturn.radius;
  for (const m of [bodies.earth.mesh.material, bodies.earth.clouds && bodies.earth.clouds.material]) {
    if (m) m.userData.analyticUniforms.uOccR.value = moonOccR;
  }
  moonMesh.material.userData.analyticUniforms.uOccR.value = earthOccR;
  if (saturnRings) saturnRings.material.userData.analyticUniforms.uOccR.value = saturnOccR;

  // keep the name labels hugging the (now smaller) bodies instead of floating
  // far above them at their old display-size offsets
  for (const ls of labelSprites) {
    const k = ls.key;
    if (k === 'belt') continue;                 // fixed point on the belt ring
    if (k === 'sun') { ls.sp.position.y = SUN_R + 3.5; continue; }   // sun is the reference, unchanged
    const r = on ? Math.max(realSceneR(k), 0.15) : (k === 'moon' ? MOON_R : bodies[k].radius);
    const gap = on ? Math.max(0.5, r * 0.6) : (k === 'moon' ? 0.9 : Math.max(1.2, r * 0.5));
    ls.sp.position.y = r + gap;
  }
}

// =====================================================================
//  Compare mode: line up all 8 planets side by side at true relative size
// =====================================================================
// A "size comparison" view: every planet is placed on a straight row, right
// next to each other (largest → smallest), scaled so its radius is proportional
// to reality *relative to the other planets*. The Sun is parked above the row
// and acts as the light source, so each planet still shows a proper day/night
// terminator. Orbits, the asteroid belt and the Moon's orbit are hidden; the
// planets keep spinning in place. The Sun is shown at its TRUE scale too — so
// vast that only its lower limb fits on screen, like a giant rising sun.
let compareMode = localStorage.getItem('ssx_compare') === '1';
const COMPARE_SUN_Y = 74;                  // height of the Sun's CENTRE above the row
const CMP_JUP_R = 6;                       // display radius of Jupiter (largest planet)
const CMP_LABEL_Y = CMP_JUP_R + 2.5;       // one neat line height for all planet labels
const CMP_VIEW_POS = new THREE.Vector3(20.3, 19.2, 41); // camera spot that frames row + Sun
const CMP_LOOK = new THREE.Vector3(0, 8, 0);           // where it looks (just above the row)
const cmpR = key => CMP_JUP_R * REAL_KM[key] / REAL_KM.jupiter;   // true size relative to the planets
const CMP_SUN_R = CMP_JUP_R * REAL_KM.sun / REAL_KM.jupiter;      // Sun at TRUE scale (~10× Jupiter)
let beltLabel = null;                      // set once the labels are built

function layoutCompare() {
  const order = [...PLANETS].sort((a, b) => REAL_KM[b.key] - REAL_KM[a.key]); // largest → smallest
  // visible half-width of each body — Saturn counts its rings, not just the globe
  const foot = p => p.key === 'saturn' ? 2.15 * cmpR('saturn') : cmpR(p.key);
  // label world width at the compare-view distance (labels keep constant screen size)
  const lsScale = clamp(CMP_VIEW_POS.distanceTo(CMP_LOOK) * 0.02, 0.29, 43);
  const labelW = key => {
    const ls = labelSprites.find(l => l.key === key);
    return ls ? lsScale * ls.sp.userData.aspect : 0;
  };
  // centre-to-centre distance: clear the visible bodies (min gap) AND keep
  // adjacent name labels from touching, so they form one neat line
  const gaps = [];
  for (let i = 0; i < order.length - 1; i++) {
    const a = order[i], b = order[i + 1];
    gaps.push(Math.max(foot(a) + foot(b) + 1.0,
                       (labelW(a.key) + labelW(b.key)) / 2 + 0.4));
  }
  const centers = [0];
  for (let i = 1; i < order.length; i++) centers.push(centers[i - 1] + gaps[i - 1]);
  const mid = (centers[0] + centers[order.length - 1]) / 2;
  for (let i = 0; i < order.length; i++)
    bodies[order[i].key].group.position.set(centers[i] - mid, 0, 0);

  // true relative sizes (relative to each other) — scale meshes & shadow uniforms
  for (const p of PLANETS) {
    const b = bodies[p.key];
    const f = cmpR(p.key) / p.r;
    b.mesh.scale.setScalar(f);
    if (b.clouds) b.clouds.scale.setScalar(f);
    if (p.atmo) p.atmo.scale.setScalar(f);
    if (p.key === 'saturn' && saturnRings) {
      saturnRings.scale.setScalar(f);
      SATURN_RING.inner = p.r * 1.25 * f;
      SATURN_RING.outer = p.r * 2.15 * f;
      for (const m of [b.mesh.material, saturnRings.material])
        m.userData.analyticUniforms.uRingRadii.value.set(SATURN_RING.inner, SATURN_RING.outer);
    }
  }
  const moonCmpR = Math.max(cmpR('moon'), 0.3);
  moonMesh.scale.setScalar(moonCmpR / MOON_R);

  // Sun parked above the row as the light source — at TRUE scale relative to the
  // planets (~10× Jupiter), so kids see just how vast it is. Only its lower limb
  // fits on screen, like a giant rising sun.
  sunMesh.scale.setScalar(CMP_SUN_R / SUN_R);
  glow.scale.setScalar(CMP_SUN_R * 3);     // corona hugging the limb (5.2× would wash out the row)
  sunMesh.position.set(0, COMPARE_SUN_Y, 0);
  glow.position.copy(sunMesh.position);
  sunLight.position.copy(sunMesh.position);

  // Moon: parked just above Earth (it is not one of the 8 planets)
  const e = bodies.earth.group.position;
  moonPos.set(e.x + 3, e.y + 4, e.z - 2);
  moonMesh.position.copy(moonPos);
  moonLabel.position.copy(moonPos).add(new THREE.Vector3(0, moonCmpR + 0.6, 0));

  // analytic-shadow occluder radii must match the displayed sizes
  for (const m of [bodies.earth.mesh.material, bodies.earth.clouds && bodies.earth.clouds.material])
    if (m) m.userData.analyticUniforms.uOccR.value = moonCmpR;
  moonMesh.material.userData.analyticUniforms.uOccR.value = cmpR('earth');
  if (saturnRings) saturnRings.material.userData.analyticUniforms.uOccR.value = cmpR('saturn');

  // Name labels: one neat horizontal line above the row — same height for all,
  // and the spacing above guarantees adjacent labels never touch or overlap
  for (const ls of labelSprites) {
    if (ls.key === 'belt' || ls.key === 'moon') continue;   // handled above / fixed point
    if (ls.key === 'sun') { ls.sp.position.set(0, COMPARE_SUN_Y - CMP_SUN_R + 4, 0); continue; }
    ls.sp.position.y = CMP_LABEL_Y;
  }
}

function setCompareMode(on) {
  compareMode = on;
  for (const p of PLANETS) if (p.orbitLine) p.orbitLine.visible = !on;
  belt.visible = !on;
  beltDust.visible = !on;
  moonOrbitGroup.visible = !on;
  if (beltLabel) beltLabel.visible = !on && $('labelsBtn').classList.contains('active');
  setAnalyticShadows(!on);         // off in Compare mode (Sun is not at the origin there)
  if (on) {
    layoutCompare();
  } else {
    applyRealScale(realScale);     // restore sizes + shadow uniforms for the user's size mode
    updatePositions();             // send everything back to its orbit
    sunMesh.scale.setScalar(1);
    glow.scale.setScalar(SUN_R * 5.2);
    sunMesh.position.set(0, 0, 0);
    glow.position.set(0, 0, 0);
    sunLight.position.set(0, 0, 0);
  }
}

// --- asteroid belt ----------------------------------------------------
// two layers: main rocks (2× the old count) + a dense layer of tiny dust
// fragments, so the small objects are by far the most numerous.
// placed to match the real gaps: Mars aphelion (76.5) → belt → Jupiter
// perihelion (99.9); in reality the outer gap is ~4× the inner one.
const BELT_INNER = 80, BELT_OUTER = 90;
const BELT_COUNT = 3000, BELT_DUST_COUNT = 1500;
const beltGeo = new THREE.DodecahedronGeometry(1, 0);
const beltMat = new THREE.MeshStandardMaterial({ color: 0x8a7f70, roughness: 1 });
const belt = new THREE.InstancedMesh(beltGeo, beltMat, BELT_COUNT);
{
  const dummy = new THREE.Object3D();
  let s = 1234;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < BELT_COUNT; i++) {
    const r = BELT_INNER + Math.pow(rnd(), 0.8) * (BELT_OUTER - BELT_INNER);
    const a = rnd() * Math.PI * 2;
    dummy.position.set(Math.cos(a) * r, (rnd() - 0.5) * 3, Math.sin(a) * r);
    dummy.rotation.set(rnd() * Math.PI, rnd() * Math.PI, rnd() * Math.PI);
    const sc = 0.06 + rnd() * rnd() * 0.3;
    dummy.scale.set(sc, sc * (0.7 + rnd() * 0.6), sc);
    dummy.updateMatrix();
    belt.setMatrixAt(i, dummy.matrix);
  }
}
scene.add(belt);
const beltDustGeo = new THREE.TetrahedronGeometry(1, 0);
const beltDustMat = new THREE.MeshStandardMaterial({ color: 0x6f675c, roughness: 1 });
const beltDust = new THREE.InstancedMesh(beltDustGeo, beltDustMat, BELT_DUST_COUNT);
{
  const dummy = new THREE.Object3D();
  let s = 987654;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < BELT_DUST_COUNT; i++) {
    const r = BELT_INNER + Math.pow(rnd(), 0.85) * (BELT_OUTER - BELT_INNER);
    const a = rnd() * Math.PI * 2;
    dummy.position.set(Math.cos(a) * r, (rnd() - 0.5) * 3.4, Math.sin(a) * r);
    dummy.rotation.set(rnd() * Math.PI, rnd() * Math.PI, rnd() * Math.PI);
    const sc = 0.02 + rnd() * rnd() * 0.07;
    dummy.scale.set(sc, sc * (0.7 + rnd() * 0.6), sc);
    dummy.updateMatrix();
    beltDust.setMatrixAt(i, dummy.matrix);
  }
}
scene.add(beltDust);

// --- labels -----------------------------------------------------------
const labelSprites = [];
function makeLabelSprite(text) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const fs = 44;
  ctx.font = `600 ${fs}px "Segoe UI", system-ui, sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + 28;
  cv.width = w; cv.height = fs + 20;
  const c2 = cv.getContext('2d');
  c2.font = `600 ${fs}px "Segoe UI", system-ui, sans-serif`;
  c2.fillStyle = 'rgba(10,16,36,0.55)';
  c2.beginPath(); c2.roundRect(0, 0, w, cv.height, 14); c2.fill();
  c2.fillStyle = '#ffd24a';
  c2.textBaseline = 'middle';
  c2.fillText(text, 14, cv.height / 2 + 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.userData.aspect = w / cv.height;
  return sp;
}
function addLabel(key, parent, yOffset) {
  const sp = makeLabelSprite(t().bodies[key].name);
  sp.position.y = yOffset;
  parent.add(sp);
  labelSprites.push({ sp, key });
  return sp;
}
addLabel('sun', scene, SUN_R + 3.5);
for (const p of PLANETS) addLabel(p.key, bodies[p.key].group, p.r + Math.max(1.2, p.r * 0.5));
// Moon label lives in the scene (not on moonMesh) so real-size scaling of the
// mesh can't shrink it; its position is tracked in updatePositions().
const moonLabel = addLabel('moon', scene, MOON_R + 0.9);
{ // belt label at a fixed point on the ring
  const sp = makeLabelSprite(t().bodies.belt.name);
  sp.position.set((BELT_INNER + BELT_OUTER) / 2, 2.5, 0);
  scene.add(sp);
  labelSprites.push({ sp, key: 'belt' });
  beltLabel = sp;   // kept so Compare mode can hide it with the belt
}

// --- eclipse shadow cones (educational overlay) ------------------------
const umbraCone = new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 1, 32, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.30, side: THREE.DoubleSide, depthWrite: false })
);
umbraCone.visible = false;
scene.add(umbraCone);
const penumbraCone = new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 1, 32, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x223a66, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false })
);
penumbraCone.visible = false;
scene.add(penumbraCone);

// =====================================================================
//  Simulation state
// =====================================================================
let simDays = 0;
let daysPerSecond = 0.02;
let paused = false;
let eclipseMode = false;
let savedDps = 0.02;
let realScale = localStorage.getItem('ssx_realscale') === '1';   // off by default

const earthPos = new THREE.Vector3();
const moonPos = new THREE.Vector3();

function updatePositions() {
  for (const p of PLANETS) {
    const b = bodies[p.key];
    if (!compareMode) planetPos(p, simDays, b.group.position);   // elliptical orbit, tilted plane
    b.mesh.rotation.y = (simDays / p.rotDays) * Math.PI * 2;    // spin in place (also in Compare mode)
    if (p.clouds) p.clouds.rotation.y = (simDays / p.rotDays) * Math.PI * 2 * 1.18;
  }
  earthPos.copy(bodies.earth.group.position);

  if (!compareMode) {
    const ma = (simDays / 27.32) * Math.PI * 2 + 1.0 + moonPhaseOffset;
    moonPos.set(
      earthPos.x + Math.cos(ma) * MOON_DIST,
      earthPos.y + Math.sin(ma) * MOON_DIST * Math.sin(moonInc),
      earthPos.z + Math.sin(ma) * MOON_DIST * Math.cos(moonInc)
    );
    moonMesh.position.copy(moonPos);
    // Tidally locked: the same face always points at Earth. The texture's centre
    // meridian (u=0.5, the near-side maria) sits on local +X, and rotation.y = θ
    // aims +X at (cos θ, 0, −sin θ) — so aim it along the Moon→Earth direction.
    const toEarthX = earthPos.x - moonPos.x, toEarthZ = earthPos.z - moonPos.z;
    moonMesh.rotation.y = Math.atan2(-toEarthZ, toEarthX);

    // keep the (scene-parented) Moon label above the scaled Moon
    const mr = realScale ? Math.max(realSceneR('moon'), 0.15) : MOON_R;
    moonLabel.position.set(moonPos.x, moonPos.y + mr + (realScale ? 0.5 : 0.9), moonPos.z);

    moonOrbitGroup.position.copy(earthPos);
    moonOrbitLine.rotation.x = -moonInc;
  } else {
    // Compare mode: the Moon is parked just above Earth (set in layoutCompare) —
    // keep it there and let it spin with the same clock as everything else.
    moonMesh.rotation.y = (simDays / 27.32) * Math.PI * 2;
  }

  const beltRot = (simDays / 1600) * Math.PI * 2;
  belt.rotation.y = beltRot;
  beltDust.rotation.y = beltRot;   // dust shares the main belt's orbit
}

// =====================================================================
//  Camera: free flight + click-to-follow
// =====================================================================
const yawPitch = { yaw: 0, pitch: -0.35 };
camera.rotation.order = 'YXZ';
camera.rotation.set(yawPitch.pitch, yawPitch.yaw, 0);

let followKey = null;          // body key being followed
let followOffset = new THREE.Vector3();
let flight = null;             // { from, t, dur, key }

const HOME_POS = new THREE.Vector3(0, 70, 165);

function bodyWorldPos(key) {
  if (key === 'sun') return new THREE.Vector3(0, compareMode ? COMPARE_SUN_Y : 0, 0);
  if (key === 'moon') return moonPos.clone();
  // the Asteroid Belt "place": a fixed point inside the band (the rocks drift past it)
  if (key === 'belt') return new THREE.Vector3((BELT_INNER + BELT_OUTER) / 2, 0, 0);
  return bodies[key].group.position.clone();
}
function bodyRadius(key) {
  if (key === 'belt') return 2.5;   // no solid body — just a sensible approach distance
  let r;
  if (key === 'sun') r = SUN_R;
  else if (key === 'moon') r = MOON_R;
  else r = bodies[key].radius;
  if (compareMode) {
    // true size relative to the other planets — and the Sun at its TRUE scale too
    r = key === 'sun' ? CMP_SUN_R : Math.max(cmpR(key), 0.15);
  } else if (realScale) {
    // true-to-scale radius, floored so tiny planets stay outside the camera's
    // near plane and keep a sensible minimum approach distance
    r = Math.max(realSceneR(key), 0.15);
  }
  return r;
}

function startFlightTo(key) {
  // the belt only exists on the real orbits — leave Compare mode first
  if (key === 'belt' && compareMode) { setCompareMode(false); refreshCompareBtn(); }
  flight = { from: camera.position.clone(), t: 0, dur: 1.6, key };
  followKey = null;
  spinTheta = 0; spinPhi = 0;   // no leftover orbit inertia for the next body
  showInfo(key);
}

function updateCamera(dt) {
  const keys = input.keys;
  const boost = keys.has('shift') ? (followKey ? 3 : 5) : 1;

  if (flight) {
    flight.t += dt / flight.dur;
    const k = clamp(flight.t, 0, 1);
    const e = k * k * (3 - 2 * k);
    const target = bodyWorldPos(flight.key);
    const dir = camera.position.clone().sub(target);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0.4, 1);
    dir.normalize();
    const dist = Math.max(bodyRadius(flight.key) * 4.5, 2.5);
    camera.position.lerpVectors(flight.from, target.clone().addScaledVector(dir, dist), e);
    camera.lookAt(target);
    if (flight.t >= 1) {
      followKey = flight.key;
      followOffset.copy(camera.position).sub(bodyWorldPos(followKey));
      flight = null;
    }
    return;
  }

  const speedBase = followKey
    ? clamp(followOffset.length() * 1.4, 2, 90)
    : 30;
  const speed = speedBase * boost * dt;

  if (followKey) {
    // orbit-style: keep offset relative to the moving body
    const target = bodyWorldPos(followKey);
    const fwd = target.clone().sub(camera.position).normalize();
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    if (keys.has('w')) followOffset.addScaledVector(fwd, speed);
    if (keys.has('s')) followOffset.addScaledVector(fwd, -speed);
    if (keys.has('a')) followOffset.addScaledVector(right, -speed);   // A = strafe left
    if (keys.has('d')) followOffset.addScaledVector(right, speed);    // D = strafe right
    if (keys.has(' ')) followOffset.y += speed;
    if (keys.has('control')) followOffset.y -= speed;
    const minD = bodyRadius(followKey) * 1.25, maxD = bodyRadius(followKey) * 40 + 30;
    followOffset.clampLength(minD, maxD);
    camera.position.copy(target).add(followOffset);
    camera.lookAt(target);
  } else {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    if (keys.has('w')) camera.position.addScaledVector(fwd, speed);
    if (keys.has('s')) camera.position.addScaledVector(fwd, -speed);
    if (keys.has('a')) camera.position.addScaledVector(right, -speed);   // A = strafe left
    if (keys.has('d')) camera.position.addScaledVector(right, speed);    // D = strafe right
    if (keys.has(' ')) camera.position.y += speed;
    if (keys.has('control')) camera.position.y -= speed;
    // soft collision: don't get stuck inside a body
    for (const pk of ['sun', 'moon', ...PLANETS.map(p => p.key)]) {
      const c = bodyWorldPos(pk), r = bodyRadius(pk) * 1.08;
      const d = camera.position.distanceTo(c);
      if (d < r && d > 1e-6) {
        camera.position.copy(c).addScaledVector(camera.position.clone().sub(c).normalize(), r);
      }
    }
  }
}

// =====================================================================
//  Input
// =====================================================================
const input = { keys: new Set() };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d',' '].includes(k)) e.preventDefault();
  input.keys.add(k === 'control' ? 'control' : k);
  if (k === 'escape') {
    if ($('helpModal').style.display === 'flex') closeHelp();
    else if (followKey || flight) { followKey = null; flight = null; hideInfo(); }
    else if (eclipseMode) stopEclipse();   // documented exit: Esc returns to normal time
  }
});
addEventListener('keyup', e => input.keys.delete(e.key.toLowerCase() === 'control' ? 'control' : e.key.toLowerCase()));
addEventListener('blur', () => input.keys.clear());

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let dragging = false, dragMoved = 0, downX = 0, downY = 0, downT = 0;
// swipe-to-orbit: a one-finger swipe while following swings the camera around
// the followed body and keeps orbiting with inertia after release; only very
// slow drags (deliberate positioning) don't launch a spin
let spinTheta = 0, spinPhi = 0;   // angular velocity in rad/s

// --- pointer input: mouse + touch in one set of handlers -----------------
// One finger / left button: look around.  Tap / click: fly to a planet.
// Pinch (two fingers): zoom.  Two-finger drag: fly (map-style pan).
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const pointers = new Map();   // pointerId -> {x, y}
let pinchDist0 = 0, pinchMid0 = null;

function setNDC(x, y) { mouseNDC.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); }

// look around (mouse drag & one-finger touch drag)
function applyLook(dx, dy) {
  if (followKey) {
    // rotate the offset around the followed body
    const target = bodyWorldPos(followKey);
    const off = camera.position.clone().sub(target);
    const sph = new THREE.Spherical().setFromVector3(off);
    sph.theta -= dx * 0.005;
    sph.phi = clamp(sph.phi - dy * 0.005, 0.12, Math.PI - 0.12);
    off.setFromSpherical(sph);
    camera.position.copy(target).add(off);
    followOffset.copy(off);
    camera.lookAt(target);
  } else {
    yawPitch.yaw -= dx * 0.0032;
    yawPitch.pitch = clamp(yawPitch.pitch - dy * 0.0032, -1.55, 1.55);
    camera.rotation.set(yawPitch.pitch, yawPitch.yaw, 0);
  }
}

// zoom (pinch): factor < 1 = closer
function applyZoom(factor) {
  if (followKey) {
    followOffset.multiplyScalar(factor);
    followOffset.clampLength(bodyRadius(followKey) * 1.25, bodyRadius(followKey) * 40 + 30);
  } else {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    // dolly along the view direction; scale with distance so it feels similar at any zoom level
    camera.position.addScaledVector(fwd, -Math.log(factor) * Math.max(camera.position.length() * 0.4, 6));
  }
}

// fly (two-finger drag): map-style pan — the scene moves with your fingers.
// Vertical uses the camera's own screen-up axis (not the flight direction),
// so dragging down scrolls the scene down exactly like dragging right scrolls
// it right — a true 2D pan, matching the help text "fly in the direction you drag".
function applyFly(dx, dy) {
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
  const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const s = Math.max(camera.position.length() * 0.5, 10) / innerHeight;
  if (followKey) {
    // in follow mode the camera is derived from followOffset every frame, so
    // move the offset itself — moving camera.position would be overwritten
    followOffset.addScaledVector(right, -dx * s);
    followOffset.addScaledVector(camUp, dy * s);
    followOffset.clampLength(bodyRadius(followKey) * 1.25, bodyRadius(followKey) * 40 + 30);
  } else {
    camera.position.addScaledVector(right, -dx * s);
    camera.position.addScaledVector(camUp, dy * s);
  }
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  renderer.domElement.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragging = true; dragMoved = 0; downX = e.clientX; downY = e.clientY; downT = performance.now();
    spinTheta = 0; spinPhi = 0;     // grabbing the view takes over from any running orbit
    setNDC(e.clientX, e.clientY);   // refresh NDC so a tap raycasts from the actual press point
  } else if (pointers.size === 2) {
    // second finger landed: switch to pinch/pan mode and cancel any pending tap
    dragging = false; dragMoved = Infinity;
    const [a, b] = [...pointers.values()];
    pinchDist0 = Math.hypot(a.x - b.x, a.y - b.y);
    pinchMid0 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  setNDC(e.clientX, e.clientY);
  if (pointers.size === 1) {
    dragMoved += Math.abs(dx) + Math.abs(dy);
    applyLook(dx, dy);
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinchDist0 > 0 && dist > 0) applyZoom(pinchDist0 / dist);
    pinchDist0 = dist;
    applyFly(mid.x - pinchMid0.x, mid.y - pinchMid0.y);
    pinchMid0 = mid;
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 1) {
    // pinch ended with one finger left: keep looking with it, but never treat as a tap
    const [p] = [...pointers.values()];
    dragging = true; dragMoved = Infinity; downX = p.x; downY = p.y; downT = performance.now();
    return;
  }
  if (pointers.size === 0) {
    const tapLimit = e.pointerType === 'mouse' ? 6 : 12;
    const wasClick = dragging && dragMoved < tapLimit && performance.now() - downT < 450;
    if (!wasClick && e.pointerType !== 'mouse' && followKey && !flight) {
      // one-finger swipe while following: launch the orbit spin (follow mode
      // only). A normal swipe gives a gentle orbit with inertia; a fast flick
      // spins faster. Very slow drags stay put so you can position precisely.
      const dtMs = Math.max(performance.now() - downT, 1);
      const vx = (e.clientX - downX) / dtMs * 1000;   // px/s
      const vy = (e.clientY - downY) / dtMs * 1000;
      if (Math.hypot(vx, vy) > 350) {
        spinTheta = clamp(-vx * 0.002, -6, 6);
        spinPhi   = clamp(-vy * 0.0012, -3, 3);
      }
    }
    dragging = false;
    if (wasClick) {
      setNDC(e.clientX, e.clientY);
      raycaster.setFromCamera(mouseNDC, camera);
      const hits = raycaster.intersectObjects(pickables, false);
      if (hits.length) startFlightTo(hits[0].object.userData.bodyKey);
      else if (followKey) { followKey = null; flight = null; spinTheta = 0; spinPhi = 0; hideInfo(); }
    }
  }
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) dragging = false;
});

// mouse wheel: zoom (dolly) in / out
addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY;
  if (followKey) {
    // zoom toward / away from the followed body by scaling the orbit offset
    followOffset.multiplyScalar(1 + d * 0.0012);
    followOffset.clampLength(bodyRadius(followKey) * 1.25, bodyRadius(followKey) * 40 + 30);
  } else {
    // free flight: move along the view direction
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    camera.position.addScaledVector(fwd, -d * 0.06);
  }
}, { passive: false });

// hover cursor
let hoverTick = 0;
function updateHover() {
  if (++hoverTick % 3 !== 0 || dragging) return;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  renderer.domElement.style.cursor = hits.length ? 'pointer' : 'default';
}

let eclipseBannerTimer = null;
function flashEclipseBlocked() {

  // orbits, so the Moon can't cast an umbra — explain instead of faking it.
  $('eclipseBanner').style.display = 'block';

  eclipseBannerTimer = setTimeout(() => { if (!eclipseMode) $('eclipseBanner').style.display = 'none'; }, 5000);
}
function startEclipse() {
  if (compareMode) { setCompareMode(false); refreshCompareBtn(); }   // eclipse needs the real orbits
  if (realScale) { flashEclipseBlocked(); return; }
  eclipseMode = true;
  savedDps = daysPerSecond;
  daysPerSecond = 0.1;      // slow motion: the shadow takes ~45 s to cross Earth
  paused = false;
  refreshPlayBtn(); refreshSpeedUI();
  moonInc = 0;              // force the Moon onto the Sun–Earth line (new moon at a node)

  // place the Moon exactly between Sun and Earth (only the Moon moves)
  const dirToSun = earthPos.clone().negate().normalize();   // Earth -> Sun
  const wantA = Math.atan2(dirToSun.z, dirToSun.x);
  const curA = ((simDays / 27.32) * Math.PI * 2 + 1.0) % (Math.PI * 2);
  moonPhaseOffset = (wantA - curA + Math.PI * 2) % (Math.PI * 2);

  // fly the camera to a good viewing spot: outside, sun-side, slightly above
  const viewDir = dirToSun.clone();
  const camTarget = earthPos.clone().addScaledVector(viewDir, 26).add(new THREE.Vector3(0, 14, 0));
  flight = { from: camera.position.clone(), t: 0, dur: 2.2, key: '__eclipseView' };
  flight.eclipseCamTo = camTarget;
  followKey = null;
  spinTheta = 0; spinPhi = 0;   // no leftover flick-spin when the eclipse view lands

  umbraCone.visible = true;
  penumbraCone.visible = true;
  $('eclipseBanner').style.display = 'block';
  $('eclipseBanner').textContent = t().eclipseBanner;
  $('eclipseBtn').classList.add('active');

}

function stopEclipse() {

  daysPerSecond = savedDps;

// The cone shape evolves slowly, so rebuild the CylinderGeometry only when it
// actually changed (relative epsilon) instead of allocating two new geometries
// every single frame.
const _coneDir = new THREE.Vector3();
const _coneNeg = new THREE.Vector3();
const _coneUp = new THREE.Vector3(0, 1, 0);
let coneShape = null;   // { mR, xL, rUmbraEnd, rPenEnd } of the currently built geometry
function updateEclipseCones() {
  if (!eclipseMode) return;
  const mR = realScale ? realSceneR('moon') : MOON_R;          // Moon radius in current scale mode
  _coneDir.copy(moonPos).normalize();                          // Sun -> Moon (and on to Earth)
  const dMoon = moonPos.length();
  const L = earthPos.length() + 6;                             // extend a bit past Earth
  const xL = L - dMoon;                                        // distance from Moon to far end

  // The analytic shadow treats the Sun as a disc, so behind the Moon the
  // umbra CONVERGES (tangent rays from the Sun's far edge cross) while the
  // penumbra diverges. We match that exactly so the drawn cones line up with
  // the real dark spot rendered on Earth.
  const rUmbraEnd = Math.max(mR - xL * ((SUN_R - mR) / dMoon), 0.02); // extended-Sun umbra edge
  const rPenEnd   = mR + xL * ((SUN_R + mR) / dMoon);                // penumbra edge

  const near = (a, b) => Math.abs(a - b) <= 1e-3 * Math.max(1, Math.abs(a), Math.abs(b));
  const c = coneShape;
  if (!c || !near(c.mR, mR) || !near(c.xL, xL) || !near(c.rUmbraEnd, rUmbraEnd) || !near(c.rPenEnd, rPenEnd)) {
    coneShape = { mR, xL, rUmbraEnd, rPenEnd };
    umbraCone.geometry.dispose();
    umbraCone.geometry = new THREE.CylinderGeometry(mR, rUmbraEnd, xL, 32, 1, true);
    penumbraCone.geometry.dispose();
    penumbraCone.geometry = new THREE.CylinderGeometry(mR, rPenEnd, xL, 32, 1, true);
  }

  // cylinder local +Y is mapped to -dir, so the TOP (r=mR) sits at the Moon
  umbraCone.position.copy(moonPos).addScaledVector(_coneDir, xL / 2);
  penumbraCone.position.copy(moonPos).addScaledVector(_coneDir, xL / 2);
  _coneNeg.copy(_coneDir).negate();
  umbraCone.quaternion.setFromUnitVectors(_coneUp, _coneNeg);
  penumbraCone.quaternion.setFromUnitVectors(_coneUp, _coneNeg);
}
