// =====================================================================
//  Main loop
// =====================================================================
const clock = new THREE.Clock();
let lastFollowShown = null;   // for the places-list highlight

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (!paused) simDays += daysPerSecond * dt;
  updatePositions();
  updateAnalyticShadows();
  updateEclipseCones();

  // special flight targets (eclipse view / home)
  if (flight && flight.key === '__eclipseView') {
    flight.t += dt / flight.dur;
    const e = clamp(flight.t, 0, 1);
    camera.position.lerpVectors(flight.from, flight.eclipseCamTo, e * e * (3 - 2 * e));
    camera.lookAt(earthPos);
    if (flight.t >= 1) { followKey = 'earth'; followOffset.copy(camera.position).sub(earthPos); flight = null; }
  } else if (flight && flight.key === '__home') {
    flight.t += dt / flight.dur;
    const e = clamp(flight.t, 0, 1);
    camera.position.lerpVectors(flight.from, HOME_POS, e * e * (3 - 2 * e));
    camera.lookAt(0, 0, 0);
    if (flight.t >= 1) {
      flight = null;
      yawPitch.yaw = 0; yawPitch.pitch = Math.atan2(-HOME_POS.y, HOME_POS.length());
      camera.rotation.set(yawPitch.pitch, yawPitch.yaw, 0);
    }
  } else if (flight && flight.key === '__compareView') {
    flight.t += dt / flight.dur;
    const k = clamp(flight.t, 0, 1);
    camera.position.lerpVectors(flight.from, CMP_VIEW_POS, k * k * (3 - 2 * k));
    camera.lookAt(CMP_LOOK);
    if (flight.t >= 1) {
      flight = null;
      // hand off to free flight with no jump: keep the exact orientation lookAt produced
      yawPitch.yaw = camera.rotation.y;
      yawPitch.pitch = clamp(camera.rotation.x, -1.55, 1.55);
      camera.rotation.set(yawPitch.pitch, yawPitch.yaw, 0);
    }
  } else {
    updateCamera(dt);
  }

  // swipe-to-orbit: decay the flick's angular velocity around the followed body
  if (followKey && !flight && (spinTheta !== 0 || spinPhi !== 0)) {
    const damp = Math.exp(-dt * 1.4);   // ~0.5 s half-life, settles in ~2 s
    const target = bodyWorldPos(followKey);
    const off = camera.position.clone().sub(target);
    const sph = new THREE.Spherical().setFromVector3(off);
    sph.theta += spinTheta * dt;
    sph.phi = clamp(sph.phi + spinPhi * dt, 0.12, Math.PI - 0.12);
    off.setFromSpherical(sph);
    camera.position.copy(target).add(off);
    followOffset.copy(off);
    camera.lookAt(target);
    spinTheta *= damp; spinPhi *= damp;
    if (Math.abs(spinTheta) < 0.005 && Math.abs(spinPhi) < 0.005) { spinTheta = 0; spinPhi = 0; }
  }

  // labels: constant screen size
  const camPos = camera.position;
  for (const ls of labelSprites) {
    if (!ls.sp.visible) continue;
    const wp = new THREE.Vector3();
    ls.sp.getWorldPosition(wp);
    const d = camPos.distanceTo(wp);
    const s = clamp(d * 0.02, 0.29, 43);   // ~28% smaller than before (was 0.028 / 0.4 / 60)
    ls.sp.scale.set(s * ls.sp.userData.aspect, s, 1);
  }

  // highlight the followed body in the places list
  const shownKey = followKey || (flight && flight.key !== '__eclipseView' && flight.key !== '__home' ? flight.key : null);
  if (shownKey !== lastFollowShown) {
    lastFollowShown = shownKey;
    for (const b of document.querySelectorAll('.placeBtn')) b.classList.toggle('active', b.dataset.key === shownKey);
  }

  // sky sphere follows the camera → zero parallax, never clipped by far plane
  if (milkySky) milkySky.position.copy(camera.position);

  updateHover();
  renderer.render(scene, camera);
}

// Debug helper (used by automated tests): screen-space position of a body
window.__ssx = {
  keys: ['sun', 'mercury', 'venus', 'earth', 'mars', 'belt', 'jupiter', 'saturn', 'uranus', 'neptune', 'moon'],
  screenPos(key) {
    const v = bodyWorldPos(key).clone().project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, behind: v.z > 1 };
  },
  pickAt(x, y) {
    const ndc = new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
    const rc = new THREE.Raycaster();
    rc.setFromCamera(ndc, camera);
    const hits = rc.intersectObjects(pickables, false);
    return { count: hits.length, first: hits[0] ? { key: hits[0].object.userData.bodyKey, dist: +hits[0].distance.toFixed(2) } : null };
  },
  camPos: () => camera.position.toArray(),
  bodyWorld: (key) => bodyWorldPos(key).toArray(),
  // Tidal-lock invariant: angle (deg) between the Moon mesh's +X axis (texture
  // centre meridian = near side) and the Moon→Earth direction. ~0 = locked.
  moonLockErr() {
    const d = earthPos.clone().sub(moonPos); d.y = 0;
    const f = new THREE.Vector3(1, 0, 0).applyQuaternion(moonMesh.quaternion); f.y = 0;
    return +THREE.MathUtils.radToDeg(f.angleTo(d)).toFixed(2);
  }
};

// =====================================================================
//  Go!
// =====================================================================
async function start() {
  applyLang();
  refreshPlayBtn();
  refreshSpeedUI();
  refreshPlaces();
  refreshScaleBtn();
  refreshCompareBtn();
  setCompareMode(compareMode);   // restore the user's Compare-mode preference
  if (compareMode) {
    // …and put the camera at the Compare view spot (no flight on load)
    camera.position.copy(CMP_VIEW_POS);
    camera.lookAt(CMP_LOOK);
    yawPitch.yaw = camera.rotation.y;
    yawPitch.pitch = clamp(camera.rotation.x, -1.55, 1.55);
    camera.rotation.set(yawPitch.pitch, yawPitch.yaw, 0);
  }
  updatePositions();

  if (texMode === 'photo') {
    // restore the user's photo preference: load what we can, keep procedural for the rest
    $('loadingText').textContent = t().loading + ' 📷';
    await Promise.all(pendingPhotoKeys().map(loadPhoto));
    applyTexMode();
  }

  $('loading').style.display = 'none';
  animate();
}
start();
</script>
